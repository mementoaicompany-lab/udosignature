name: Verify independent website
on:
  push:
    paths:
      - '.github/workflows/update-illustrations.yml'
      - 'src/**'
      - 'assets/**'
      - 'docs/**'
      - 'scripts/**'
      - 'build.py'
      - 'map_builder.py'
      - 'content/**'
      - 'site.config.json'
      - 'seo.pages.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'mementoaicompany-lab/udosignature'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify static SEO, links and committed Pages output
        run: |
          python3 build.py
          python3 scripts/check.py
          node --check assets/site.js
          node --check assets/ferry.js
          node --check assets/travel-map.js
          node scripts/check-ferry.cjs
          git diff --exit-code -- docs

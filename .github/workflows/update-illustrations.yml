name: Publish reviewed guest guide update
on:
  push:
    paths: ['.github/workflows/update-illustrations.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    if: github.repository == 'mementoaicompany-lab/udosignature'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified guest guide and business details
        run: |
          python3 - <<'PYCODE'
          import hashlib, pathlib, subprocess, zipfile
          root=pathlib.Path('.')
          source=root/'udosignature-guest-guide-update.zip'
          allowed={'README.md','SEO.md','TESTING.md','assets/site.css','build.py','scripts/check.py','seo.pages.json','site.config.json','src/guide.html','src/home.html','src/customer-guide.html'}
          subprocess.run(['git','diff','--exit-code','446e5d5020e25467bdb650f22aea8b126a22f5fc','HEAD','--',*sorted(allowed)],check=True)
          assert hashlib.sha256(source.read_bytes()).hexdigest() == 'cf53c1c295b8be40475d503d624d7bdb774bb5979f433d11a604c927ca634251'
          with zipfile.ZipFile(source) as z:
              assert set(z.namelist()) == allowed
              for entry in z.infolist():
                  p=pathlib.PurePosixPath(entry.filename)
                  assert not p.is_absolute() and '..' not in p.parts
                  z.extract(entry,root)
          source.unlink()
          PYCODE
          python3 build.py
          python3 scripts/check.py
          node --check assets/site.js
          node --check assets/ferry.js
          node --check assets/travel-map.js
          node scripts/check-ferry.cjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md SEO.md TESTING.md assets/site.css build.py scripts/check.py seo.pages.json site.config.json src/guide.html src/home.html src/customer-guide.html docs udosignature-guest-guide-update.zip
          git commit -m "Add original guest guide category and confirmed business details"
          git push origin HEAD:main

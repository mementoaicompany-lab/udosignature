name: Publish verified custom domain website
on:
  push:
    paths: ['.github/workflows/update-illustrations.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'mementoaicompany-lab/udosignature'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish reviewed custom domain sources
        run: |
          git fetch origin bc00e7ef5318726a6b9fbe09900f088fada4d609
          git checkout bc00e7ef5318726a6b9fbe09900f088fada4d609 -- README.md SEO.md build.py content/keyword-map.csv docs scripts site.config.json
          python3 - <<'PY'
          from pathlib import Path
          p=Path('README.md')
          s=p.read_text()
          s=s.replace('DNS의 루트 A 레코드는 GitHub Pages의', 'GitHub Pages에서 안내하는 루트 A 레코드는')
          s=s.replace('카페24가 허용하는 레코드 수에 제약이 있으면 실제 설정과 이유를 연결 결과 문서에 기록합니다.', '2026-09-20 카페24 호스팅센터 DNS는 루트 A 추가를 1개로 제한하므로 실제 루트 A는 185.199.111.153 하나로 연결했습니다. 카페24 쇼핑몰의 기존 A 주소 3개는 제거했습니다. www CNAME은 mementoaicompany-lab.github.io로 저장했습니다.')
          s=s.replace('은 이번 연결 대상에 포함하지 않으며, 기존 고객 안내 링크는', '의 사용하지 않는 카페24 쇼핑몰 연결은 해제했습니다. 기존 고객 안내 링크는')
          p.write_text(s)
          PY
          python3 build.py
          python3 scripts/check.py
          node --check assets/site.js
          node --check assets/ferry.js
          node --check assets/travel-map.js
          node scripts/check-ferry.cjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md SEO.md build.py content/keyword-map.csv docs scripts site.config.json
          git commit -m "Publish udosignature.com after Cafe24 DNS connection"
          git push origin HEAD:main

name: Apply verified direct guide URL
on:
  push:
    paths:
      - '.github/workflows/update-illustrations.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    if: github.repository == 'mementoaicompany-lab/udosignature'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply only reviewed guide URL changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('site.config.json')
          s=p.read_text()
          old='"guideUrl": "https://mementoaicompany-lab.github.io/coconara/"'
          new='"guideUrl": "https://guide.udosignature.com/"'
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          p=Path('README.md')
          s=p.read_text()
          old='/customer-guide/의 원본 링크는 이 리디렉션을 따라갑니다.'
          new='/customer-guide/의 iframe과 원본 링크는 새 HTTPS 주소 https://guide.udosignature.com/ 을 직접 사용해 이전 리디렉션 캐시의 영향을 피합니다.'
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          PY
          python3 build.py
          python3 scripts/check.py
          node scripts/check-ferry.cjs
          python3 - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed=={'site.config.json','README.md','docs/404.html','docs/customer-guide/index.html'},changed
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site.config.json README.md docs/404.html docs/customer-guide/index.html
          git commit -m 'Use HTTPS guide domain directly in customer links'
          git push origin HEAD:main

name: Verify independent brand website
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'mementoaicompany-lab/udosignature'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and check static site
        run: |
          python3 build.py
          python3 scripts/check.py
          python3 scripts/check-raw-import.py
          python3 scripts/check-runtime-policy.py
          node scripts/check-admin-write.mjs
          node --test tests/*.test.mjs
          find docs -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -r -n1 node --check
          if [ -f scripts/check-ferry.cjs ]; then node scripts/check-ferry.cjs; fi
          git diff --exit-code -- docs

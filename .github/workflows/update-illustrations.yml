name: Publish verified pastel pink redesign
on:
  push:
    paths: ['.github/workflows/update-illustrations.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    if: github.repository == 'mementoaicompany-lab/udosignature'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify archive and apply reviewed source
        run: |
          python3 - <<'PYCODE'
          import hashlib, pathlib, subprocess, zipfile
          root=pathlib.Path('.')
          source=root/'udosignature-pink-update.zip'
          assert subprocess.check_output(['git','hash-object','build.py'],text=True).strip() == '8633f273edc06a5a670d0b8426daeaa69aac0bb2'
          assert hashlib.sha256(source.read_bytes()).hexdigest() == 'c54b0ec2b645baf57c21d3f1c0629fce0f9ab1b95963ceb75d1bd5fb34bafcee'
          allowed={'build.py','map_builder.py','site.config.json','seo.pages.json','README.md','SEO.md','TESTING.md','.gitignore'}
          with zipfile.ZipFile(source) as z:
              for entry in z.infolist():
                  p=pathlib.PurePosixPath(entry.filename)
                  assert not p.is_absolute() and '..' not in p.parts
                  assert p.parts[0] in {'assets','src','scripts','content'} or str(p) in allowed
                  assert not any(x in p.parts for x in ['.git','.openai','.github','CNAME'])
                  z.extract(entry,root)
          source.unlink()
          PYCODE
          python3 build.py
          python3 scripts/check.py
          node --check assets/site.js
          node --check assets/ferry.js
          node --check assets/travel-map.js
          node scripts/check-ferry.cjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets src scripts content docs build.py map_builder.py site.config.json seo.pages.json README.md SEO.md TESTING.md .gitignore udosignature-pink-update.zip
          git commit -m "Publish pink Coconara redesign with travel tools and SEO"
          git push origin HEAD:main
